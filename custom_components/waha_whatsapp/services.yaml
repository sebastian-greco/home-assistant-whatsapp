send_message:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    to:
      example: "+39 333 123 4567"
      required: true
      selector:
        text:
          type: tel
    title:
      example: Garage warning
      selector:
        text:
    message:
      example: The garage door has been open for 10 minutes.
      required: true
      selector:
        text:
          multiline: true
    link_preview:
      default: true
      selector:
        boolean:

send_poll:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: notify
            integration: waha_whatsapp
    title:
      example: Sleep mode
      selector:
        text:
    message:
      example: Cancel Sleep mode before it starts?
      required: true
      selector:
        text:
          multiline: true
    actions:
      example:
        - action: CANCEL_SLEEP_MODE
          title: Cancel
      required: true
      selector:
        object:
    settle_seconds:
      default: 5
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: slider
          unit_of_measurement: s
    no_action_title:
      default: No action
      example: Keep scheduled
      selector:
        text:

send_to_conversation:
  fields:
    conversation_id:
      required: true
      example: direct_opaque_456
      selector:
        text:
    message:
      required: true
      example: The house is in Home mode.
      selector:
        text:
          multiline: true
    reply_to_message_id:
      example: msg_opaque_abc
      selector:
        text:

get_group_membership:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    membership_id:
      example: membership_opaque_abc
      selector:
        text:
